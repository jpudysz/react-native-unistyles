buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10")
    }
}

def reactNativeArchitectures() {
    def value = rootProject.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

apply from: '../nitrogen/generated/android/unistyles+autolinking.gradle'

// Nitrogen adds its generated Kotlin files to java.srcDirs, which AGP 9 built-in Kotlin
// doesn't compile. It only compiles Kotlin directories from the kotlin source set.
android.sourceSets.main.kotlin.srcDirs += ["${project.projectDir}/../nitrogen/generated/android/kotlin"]

def resolveReactNativeMinorVersion() {
    def reactNativeDir = safeExtGet("REACT_NATIVE_NODE_MODULES_DIR", null)

    if (reactNativeDir == null) {
        try {
            def reactNativePackageJson = providers.exec {
                workingDir(rootDir)
                commandLine("node", "--print", "require.resolve('react-native/package.json')")
            }.standardOutput.asText.get().trim()

            reactNativeDir = file(reactNativePackageJson).parentFile
        } catch (Exception ignored) {
            reactNativeDir = file("${rootDir}/../node_modules/react-native")
        }
    }

    def reactNativePackageJson = file("${reactNativeDir}/package.json")

    if (!reactNativePackageJson.exists()) {
        logger.warn("🦄 Unistyles: React Native not found. Set REACT_NATIVE_NODE_MODULES_DIR in your root build.gradle to enable features that require React Native 0.86+.")

        return 0
    }

    String version = new groovy.json.JsonSlurper().parse(reactNativePackageJson).version

    // nightlies
    if (version.startsWith("0.0.0")) {
        return Integer.MAX_VALUE
    }

    def (major, minor) = version.tokenize('.')

    return major.toInteger() > 0 ? Integer.MAX_VALUE : minor.toInteger()
}

// Kotlin sources that use APIs available only in newer React Native versions
def reactNativeSourceDir = resolveReactNativeMinorVersion() >= 86 ? "src/rn86/java" : "src/legacy/java"

android.sourceSets.main.java.srcDirs += [reactNativeSourceDir]
android.sourceSets.main.kotlin.srcDirs += [reactNativeSourceDir]

def resolveBuildType() {
    Gradle gradle = getGradle()
    String tskReqStr = gradle.getStartParameter().getTaskRequests()['args'].toString()

    return tskReqStr.contains('Release') ? 'release' : 'debug'
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 35)
    namespace "com.unistyles"

    defaultConfig {
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
        minSdkVersion safeExtGet('minSdkVersion', 24)
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                abiFilters (*reactNativeArchitectures())
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    packagingOptions {
        doNotStrip resolveBuildType() == 'debug' ? "**/**/*.so" : ''
        excludes = [
            "META-INF",
            "META-INF/**",
            "**/libjsi.so",
            "**/libc++_shared.so",
            "**/libreactnative.so",
            "**/libreact_nativemodule_core.so",
            "**/libturbomodulejsijni.so",
            "**/libfbjni.so"
        ]
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation 'com.facebook.react:react-native'
    implementation project(":react-native-nitro-modules")
}

tasks.register("checkNativeTurboUnistylesSpec") {
    doLast {
        if (!isNewArchitectureEnabled()) {
            throw new GradleException("Unistyles 3.0 requires your project to have New Architecture enabled.")
        }
    }
}

preBuild.dependsOn checkNativeTurboUnistylesSpec
